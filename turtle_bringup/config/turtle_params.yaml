# Parameters for the turtle_controller nodes.
# Speed limits can also be overridden on the command line:
#   ros2 launch turtle_bringup turtle_system.launch.py max_linear_speed:=0.5
go_to_pose_server:
  ros__parameters:
    turtle_name: turtle1
    max_linear_speed: 2.0      # [m/s]
    max_angular_speed: 2.0     # [rad/s]
    k_linear: 1.5              # proportional gain on distance
    k_angular: 4.0             # proportional gain on angle error
    position_tolerance: 0.02   # [m]
    yaw_tolerance: 0.01        # [rad]
    heading_tolerance: 0.05    # [rad] facing the target before driving
    control_rate: 50.0         # [Hz]
    feedback_rate: 10.0        # [Hz]
    goal_timeout: 60.0         # [s]

reset_server:
  ros__parameters:
    turtle_name: turtle1
    start_x: 5.544445
    start_y: 5.544445
    start_theta: 0.0

square_server:
  ros__parameters:
    turtle_name: turtle1
    default_side_length: 2.0
    workspace_min: 0.5
    workspace_max: 10.5
